services:
  - type: web
    name: amber-marketplace
    env: docker
    plan: free
    dockerCommand: ""
    envVars:
      - key: APP_NAME
        value: "Amber Marketplace"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: "https://amber-marketplace.onrender.com"
      - key: CLOUDINARY_URL
        sync: false
      - key: BROADCAST_CONNECTION
        value: "reverb"
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        value: "amber-marketplace.onrender.com"
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: "https"

      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        value: "gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com"
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: "marketplace"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: "/etc/ssl/certs/ca-certificates.crt"
